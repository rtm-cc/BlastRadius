    title: AI Models Can Provably Hide Arbitrary Capabilities
    summary: New research demonstrates backdoor attacks that embed encrypted neural networks inside host
      model weights, with the hidden capability only activating on a secret trigger. The work challenges
      the assumption that capability evaluations can reliably surface dangerous hidden behaviors before
      deployment.
