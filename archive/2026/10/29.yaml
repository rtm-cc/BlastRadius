    rank: 2
    title: Unsloth Model Loader Flaw Lets Attackers Execute Code Despite trust_remote_code=False
    summary: Pillar Security disclosed CVE-2026-93348, a high-severity vulnerability in Unsloth's model
      loader that can allow arbitrary Python code execution when a maliciously crafted model configuration
      is processed. The flaw is rated 8.6 on the CVSS scale and bypasses the intended trust_remote_code=False
      protection because the vulnerable code path does not rely on Hugging Face's safeguard.
    url: https://www.csoonline.com/article/4241619/trusting-unsloths-trust-setting-could-mean-executing-malicious-code.html
    image: https://www.csoonline.com/wp-content/uploads/2026/10/4241619-0-81783500-1793188537-shutterstock_2376207999.jpg?quality=50&strip=all
    sources:
