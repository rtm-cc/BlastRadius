    title: Fake Bid Invitations and 'Protected Documents' Used in Phishing Campaign
    summary: A phishing campaign targets sales and procurement staff with emails that look like invitation-to-bid
      requests and mention a 'secured' or protected document. The lure exploits the urgency and routine
      of the bidding process to push recipients into opening the document, leading to credential theft.
      The write-up walks through the attack so readers can recognize unsolicited bid invitations that
      ask them to open protected files.
    url: https://cofense.com/blog/locked-and-loaded-phishing-through-fake-bids-and-protected-documents
