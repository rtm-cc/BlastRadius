    title: Capcom ID Data Breach Exposes 11.7 Million User Accounts
    summary: Capcom disclosed that unauthorized access to its Capcom ID service exposed 11.7 million user
      accounts, including email addresses, account creation and login metadata, and for a small subset
      date of birth and country. The attackers changed passwords on roughly 193–196 accounts; original
      passwords and credit card data were not leaked. Capcom detected the intrusion on October 19, launched
      an investigation, and notified law enforcement.
