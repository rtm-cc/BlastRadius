    title: Official Claude Code Extension on Cursor Marketplace Trojanized with Persistent SSH Backdoor
    summary: A trojanized version of Anthropic's official Claude Code extension was distributed through
      the Cursor Marketplace under the legitimate publisher identity for roughly 11 hours on October 29.
      Version 2.1.313 attempted to install a persistent SSH backdoor, exposing up to 5,000 developers
      to malware. Cursor temporarily shut down its marketplace, and a flaw in the malicious update limited
      full compromise. Affected users should inspect SSH authorized keys and rotate credentials.
