    rank: 1
    title: Trojanized Claude Code Extension on Cursor Planted SSH Backdoors in Up to 5,000 Developer Machines
    summary: Anthropic's official Claude Code VS Code extension was trojanized in Cursor's marketplace
      for about 11 hours on October 29, with malicious version 2.1.313 distributed under the legitimate
      publisher identity. The payload attempted to install persistent SSH backdoors on affected systems.
      Cursor temporarily shut down its marketplace; developers who installed or updated the extension
      during that window should treat their machines as compromised, rotate credentials, and inspect SSH
      configuration and authorized keys.
    url: https://thehackernews.com/2026/10/official-claude-code-vs-code-extension.html
