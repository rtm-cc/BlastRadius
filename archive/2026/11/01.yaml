    title: Syrian Hacker Gets Prison Time in US After Over a Decade on the Run
    summary: SecurityWeek reports that Syrian hacker Ahmad Umar Agha was sentenced
      to 42 months in a US court for pro-Assad attacks on media, businesses, and government
      entities. The report adds that he had been on the run for more than a decade
      before the sentencing.
    url: https://www.securityweek.com/syrian-hacker-gets-prison-time-in-us-after-over-a-decade-on-the-run
