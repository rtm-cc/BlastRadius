    summary: A public proof-of-concept exploit is available for CVE-2026-58882, a
      recently patched Android vulnerability dubbed 'SMS of Death.' A specially crafted
      text message can remotely crash unpatched phones or disrupt cellular service.
      Users should install the latest Android security update to mitigate the flaw.
