    title: Hackers Target 61 GitHub Repositories With Command Injection Attacks to Steal CI/CD Secrets
    summary: Radware found 83 malicious issues, pull requests, and comments posted across 61 public GitHub
      repositories on September 1, 2026, with injected commands executing inside at least two GitHub Actions
      workflows. Maintainers should review project discussions from that date, audit workflow execution
      logs, rotate CI/CD secrets that may have been exposed, and tighten permissions on issue- and PR-driven
