  - id: 92ae2d6d86b1
    rank: 5
    title: AI Coding Agents Are Installing MCP Servers That Will Never Be Patched
    summary: Glow Labs found that AI coding agents frequently install MCP servers from deprecated, unmaintained
      repositories when asked to set up integrations; in 98% of reviewed sessions the agent chose an archived
      package that will never be patched. The pattern, dubbed MCPhantom, exposes developer machines to
      avoidable supply-chain risk.
    url: https://www.helpnetsecurity.com/2026/11/03/mcphantom-deprecated-mcp-servers
    image: https://img.helpnetsecurity.com/wp-content/uploads/2026/05/26122920/connect-servers.webp
    sources:
