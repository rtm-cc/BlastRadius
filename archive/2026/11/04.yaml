    title: Haiou Codex Jailbreak Toolkit Injects Ads Into AI Responses via Persistent 'Prompt Adware'
    summary: Check Point Research found Haiou, a Chinese-language jailbreak toolkit for OpenAI Codex that
      persistently alters the coding agent's trusted instructions — global prompts, skills, and configuration
      files — so ordinary prompts trigger ads for a third-party AI gateway. Dubbed 'prompt adware,' the
      technique shows how unofficial AI add-ons can modify agent behavior without a conventional executable
      payload.
    url: https://blog.checkpoint.com/security/prompt-adware-how-hidden-ai-instructions-could-create-a-new-enterprise-security-risk
    image: https://blog.checkpoint.com/wp-content/uploads/2026/11/blog_800x400_3.png
