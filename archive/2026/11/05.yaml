    title: Google Calendar Phishing Campaign Hijacks Sessions and Bypasses MFA
    summary: Attackers are running a phishing campaign that uses Google Calendar invites and trusted redirect
      links to route corporate users to fake Google login pages. Entering credentials hands over valid
      session cookies, letting attackers bypass MFA. Material Security's Operation CloudFire analysis
      covered blocked messages and the takedown of nearly 900 attacker-controlled domains. The lure works
      because the calendar invite looks legitimate and the redirect chain starts on trusted infrastructure.
    url: https://www.bleepingcomputer.com/news/security/google-calendar-phishing-campaign-hijacks-sessions-bypasses-mfa
    image: https://www.bleepstatic.com/content/hl-images/2026/09/22/google-workspace-breach.jpg
