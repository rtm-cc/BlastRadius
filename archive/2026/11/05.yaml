    - targeted attacks
    rationale: Concrete calendar-invite phishing campaign targeting corporate Google accounts, with a
      recognizable lure and MFA bypass technique. Fits Fraud & Phishing directly and is not a repeat of
      the already-published general calendar-phishing interview.
