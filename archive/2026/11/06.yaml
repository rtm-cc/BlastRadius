  - id: b85842b516e6
    rank: 4
    title: Bank Phishing Sites Show Fake 'Suspended' Pages to First-Time Visitors Only
    summary: More than 200 bank phishing sites were observed serving phishing content only to first-time
      visitors while showing a fake "suspended" or error page to anyone who revisits. The trick defeats
