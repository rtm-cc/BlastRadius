    title: GhostMap Android bug can trap phones in endless reboot loop via crafted app
    summary: Bitdefender researchers disclosed GhostMap, an unpatched Android flaw that lets a single
      crafted app (no permissions, never opened) crash devices into a persistent boot loop, requiring
      a factory reset. The bug was found via a banking dropper that never ran; no real-world exploitation
      has been observed. Affected users should be cautious of sideloaded apps; a fix is not yet available.
