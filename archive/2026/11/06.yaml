    title: Fake OpenAI, SpaceX, and Anthropic Event Invitations Phish Microsoft and Google Accounts
    summary: Hackers are sending employees fake invitations to OpenAI, SpaceX, and Anthropic events, routing
      them through two different phishing-as-a-service platforms. The lures look like legitimate event
      registration and use familiar branding to build trust; the goal is to steal Microsoft and Google
      account credentials and hijack active authentication sessions, so victims may be logged into everything
      connected to those accounts. Look for unsolicited event invites, especially from tech-industry names,
      that link to unfamiliar registration domains.
