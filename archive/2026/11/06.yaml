    summary: 'Police are warning about a phone return scam: a caller offers a free upgrade or exclusive
      deal from your mobile provider, and a real phone actually arrives at your home. A second call then
      claims there was a shipping mistake and asks you to send the "wrong" phone back. The phone never
      reaches the provider, leaving victims with a large charge or a long-term contract. Recognize it
      by the unsolicited offer followed by a return request that uses courier or shipping-mixup excuses.'
