    title: OpenSSH 'sshhole' flaw lets long passwords bypass authentication on Alpine Linux, OpenWRT
    summary: A critical OpenSSH vulnerability (dubbed '*sshole') allows remote attackers to log in to
      password-disabled accounts on Alpine Linux and other musl-based systems (including OpenWRT) using
      an oversized password between 257 and 1,024 bytes. OpenSSH released portable 10.6p2 as an emergency
      fix on November 5; Alpine has published patched packages. The flaw affects servers configured for
      key-only authentication, bypassing the password check due to a musl libc interaction. Apply the
