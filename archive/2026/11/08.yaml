    rank: 1
    title: Claude Code's 'Don't Ask Again' Option Can Leak Passwords and API Keys to Public GitHub Repos
    summary: Apiiro researchers found that when Claude Code users select "Yes, and don't ask again," the
      AI coding assistant can save the approved command word-for-word — including embedded passwords and
      API keys — into project settings files that later reach public GitHub repositories. The research
      identified 2,539 distinct secrets across 1,994 public repositories and 63 affected organizations,
      with exposed data including an admin-level cloud key and a production Azure PostgreSQL password.
      Developers should audit Claude Code project settings and rotate any credentials that may have been
      committed.
    url: https://cybersecuritynews.com/claude-codes-yes-and-dont-ask-again
    image: https://cybersecuritynews.com/wp-content/uploads/2026/11/Claude-Codes-Yes-and-Dont-Ask-Again.webp
    sources:
