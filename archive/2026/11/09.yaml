    summary: SANS Internet Storm Center observed the first clear exploit attempts against the OpenSSH
      'SSHole' authentication bypass on November 5, using oversized passwords made entirely of repeated
      'A' characters. The flaw lets remote attackers reach some password-disabled Linux accounts on musl-based
      systems such as Alpine Linux and OpenWRT without valid credentials or an SSH key, confirming the
      issue is now being actively targeted.
