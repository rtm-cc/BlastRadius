  - id: 49cf63cb9acf
    rank: 2
    title: Shai-Hulud Descendant Ships in Malicious Ruby Gem strutil-core, Steals Credentials and Poisons
      AI Tools
    summary: Socket's Threat Research Team analyzed strutil-core 1.0.1, a malicious RubyGems package that
      runs a 5.48 MB credential-stealing worm on install and also tampers with AI tooling. The account
      jamnajiea published a clean 1.0.0 on November 1, 2026, then pushed the malicious 1.0.1 less than
      two hours later; Socket's scanner flagged it 70 seconds after publication and RubyGems removed both
      versions about five hours after the malicious release. The gem was standalone rather than a hijacked
      existing package, but it is a direct descendant of the Shai-Hulud npm worm. Ruby developers who
      installed strutil-core 1.0.1 should treat the machine as compromised, remove the gem, audit lockfiles
      and CI caches, and rotate any credentials, tokens or AI-assistant sessions exposed on that host.
    url: https://socket.dev/blog/shai-hulud-descendant-malicious-ruby-gem
