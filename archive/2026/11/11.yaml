    title: SGLang RCE Exploit Breaches NEAR AI, Steals Data From 18 Agents and Hundreds of Users
    summary: An attacker exploited a remote code execution flaw in SGLang, an open-source inference engine,
      to run code on a NEAR AI inference server. The attacker could see requests processed on the server
      that day, including confidential-mode requests, and stole data from 18 agents and about 100 users.
      NEAR AI has fixed the vulnerability and restored its Cloud service.
