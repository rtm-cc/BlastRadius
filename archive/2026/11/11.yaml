  - id: 8f4300877c77
    rank: 2
    title: Microsoft Research Detects Sleeper Agents Hidden in AI Model Neurons
    summary: Microsoft Research detailed how a capable agent model could be turned into a sleeper agent
      by editing fewer than 10 neurons to inject a short payload. The sleeper agent passes all evaluations,
      but when a trigger string appears, it runs an attacker's command, highlighting the security risk
      of model weight integrity for agents running with privileged access. The same research introduces
      techniques to detect such hidden backdoors.
    url: https://www.microsoft.com/en-us/security/blog/2026/11/10/detecting-sleeper-agents-hiding-in-ai-model-neurons
    image: https://www.microsoft.com/en-us/security/blog/wp-content/uploads/2026/11/backdoor-AI-agents.png
    sources:
    - Microsoft Threat Intelligence
    - Microsoft
    labels:
    - model backdoors
    - AI security research
    rationale: Demonstrates a reproducible backdoor attack on AI agents through minimal neuron edits,
      along with detection methods, directly relevant to model integrity.
    is_update: false
