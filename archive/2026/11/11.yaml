    title: Frontier Model Forum Proposes CVSS-Style Rating System for AI Jailbreaks
    summary: The Frontier Model Forum (FMF), founded by Anthropic, Google, Microsoft, and OpenAI, released
      a draft Jailbreak Rating Framework to grade how far an AI jailbreak can push a model past safeguards,
      the damage it can cause, and the effort required to discover and use it. The framework aims to provide
      a shared cross-vendor standard for evaluating jailbreak severity, similar to CVSS for software vulnerabilities.
    url: https://news.lavx.hu/article/frontier-model-forum-proposes-cvss-style-rating-system-for-ai-jailbreaks
    image: https://news.lavx.hu/api/media/file/frontier-model-forum-proposes-cvss-style-rating-system-for-ai-jailbreaks_gen_1794370233807-1200x630.jpg
