    title: Deepfake CEO and Fake-Lawyer Ring Charged With Stealing $129 Million
    summary: The DOJ indicted three men — Jacob Soall, Sharon Hazan, and Guy Sheetrit — for using deepfakes
      of company CEOs and law firm attorneys to trick employees into wiring more than $129 million to
      accounts the group controlled. The scheme ran from 2024 to 2026; Soall used the alias 'Rocky Balboa'
      and Hazan used 'Superman Cash' and 'Fat Boy.' The lures impersonated executives or lawyers with
      urgent payment requests, using cloned audio/video to make the fraud convincing. Unsolicited requests
      to re-route funds to new accounts should be verified through independent channels.
    url: https://www.helpnetsecurity.com/2026/11/09/deepfake-ceo-fraud-129-million-indictment
