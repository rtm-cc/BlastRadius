    rank: 1
    title: Suspected North Korean IT Workers Reached Onboarding at Companies, Exposing Files With Social
      Security Numbers
    summary: 'Material Security tracked suspected North Korean fake IT workers through hiring pipelines
      for a year and counted 27 fabricated personas that reached onboarding. The personas come with résumés
      and faces and apply for remote engineering roles. At one company where a persona got that far, about
      277,000 files containing Social Security numbers were shared company-wide or by public link. The
      scheme shows how identity fraud is used to infiltrate employers: candidates appear legitimate on
      paper and push through remote hiring and onboarding processes.'
    url: https://www.helpnetsecurity.com/2026/11/13/north-korean-it-workers-onboarding
