    rank: 2
    title: Your pinned MCP server may not be as pinned as you think
    summary: 'Corelight''s James Lagermann found that an MCP server configured to run one fixed release
      on an administrator''s workstation actually ran with 15 different dependency sets over five weeks
      with no configuration change. Twenty-three of the server''s 69 packages changed versions, including
      the cryptography library, the JSON Web Token library, and the MCP SDK itself. The silent dependency
      drift widens supply-chain risk for AI coding assistants: a seemingly pinned MCP server can absorb
      vulnerable or malicious dependency updates without the operator noticing.'
    url: https://www.helpnetsecurity.com/2026/11/13/corelight-mcp-server-supply-chain
