    title: Researchers reveal Claude Code VS Code extension can access files outside trusted workspaces
    summary: Security researchers found that Anthropic's Claude Code extension for Visual Studio Code
      can show a permission prompt that hides where a file really sits, potentially allowing access to
      files outside the trusted workspace. Anthropic reviewed the report but does not treat it as a security
      issue; the extension has over 29 million installs.
