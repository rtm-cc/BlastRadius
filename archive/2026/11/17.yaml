    title: Amazon uncovers AI agent campaign targeting LiteLLM, Dify, and other AI apps for API keys
    summary: Amazon's threat intelligence team used decoy servers to capture records of attackers' AI
      agents scanning for weak spots in internet-exposed AI applications such as LiteLLM, One API, and
      Dify. The agents stole AI provider API keys and used them to run the AI models that powered the
      search for more keys.
