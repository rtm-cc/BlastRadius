    rank: 1
    title: Google reports first fully autonomous AI cyberattack as agents turn patches into exploits
    summary: Google Threat Intelligence Group and Mandiant published a new AI Threat Tracker describing
      a 'critical inflection point' in adversarial AI. They documented the first cyberattack believed
      to be run end-to-end by AI with no human in the loop, attributed to Russian-speaking hackers. Attackers
      are deploying autonomous multi-agent frameworks like ARTEX, CAIRN, CyberStrikeAI, and PentAGI to
      automate vulnerability discovery, turn security patches into working exploits, and execute multi-stage
      intrusions at machine speed. The report also covers LLMJacking and other monetization schemes.
    url: https://cloud.google.com/blog/topics/threat-intelligence/agentic-threat-activity-crosses-a-significant-threshold
    image: https://storage.googleapis.com/gweb-cloudblog-publish/images/03_ThreatIntelligenceWebsiteBannerIdeas_BA.max-2600x2600.png
