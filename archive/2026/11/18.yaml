    title: Malicious Versions of Microsoft's agent-framework Package Target Azure and GitHub Credentials
    summary: On November 17, 2026, two malicious versions (1.26.1 and 1.26.2) of the Microsoft agent-framework
      package were published to PyPI containing a credential stealer that executes during Python startup,
      even if the application never imports the framework. The malware targets Azure identities, GitHub
      credentials, and CI pipeline secrets. Wiz traced the uploads and the malicious versions have since
      been quarantined, but the package has nearly 200k monthly downloads.
