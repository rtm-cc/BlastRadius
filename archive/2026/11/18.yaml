    title: CISA Urges Immediate Patching of Critical Java4Shell RCE (CVE-2026-114938) in OpenJDK
    summary: A critical memory-corruption flaw in OpenJDK's Base64 decoder, tracked as CVE-2026-114938
      (Java4Shell), can let an unauthenticated attacker crash the JVM or execute code on servers running
      Java 17.0.6+ on x86-64 CPUs with AVX-512 VBMI. It affects widely used applications such as Jira,
      Jenkins, Confluence, and Keycloak. Oracle shipped fixes in its November 17 update, and CISA is urging
      organizations to patch immediately.
