    title: Hackers Poison GitHub Repositories to Hijack AI Coding Agents and Steal Credentials
    summary: Attackers are planting poisoned files in GitHub repositories so that AI coding assistants
      like Claude Code and Cursor execute hidden malware when developers open the repo. The malware steals
      developer credentials and spreads to other projects. Over 22 malicious GitHub links have been identified,
      and the campaign abuses files that AI tools read for context.
