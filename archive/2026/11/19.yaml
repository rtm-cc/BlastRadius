    summary: Cloudflare's Cloudforce One observed a Java4Shell exploit attempt disguised as Chrome traffic,
      and separately linked infrastructure also associated with ARTEX. The critical OpenJDK Base64 decoder
      memory-corruption flaw (CVE-2026-114938) can allow unauthenticated RCE on x86-64 systems with AVX-512
      VBMI and affects widely used Java apps such as Jira, Jenkins, and Keycloak. Oracle and the OpenJDK
      project released fixes, and CISA strongly urges immediate patching.
