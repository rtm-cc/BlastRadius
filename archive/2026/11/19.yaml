    summary: Researchers disclosed five critical NGINX vulnerabilities, including CVE-2026-123007 ("nginx2root"),
      a decade-old HTTP/2 integer underflow that can let an unauthenticated attacker execute code on servers
      with HTTP/2 enabled. The flaw has been present since NGINX 1.9.5 (2015). F5 released fixed versions
      1.31.9 and 1.30.7; administrators should update immediately.
