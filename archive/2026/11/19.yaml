    title: AI agents inherit employee access, and nobody's watching how they use it
    summary: 'Nudge Security''s AI Adoption in Practice 2026 report reveals that enterprise AI agents
      often run on the credentials of the employee who created them, inheriting that person''s full access
      to company data. The report highlights a governance gap: organizations have little visibility into
      what these agents connect to and what they do.'
