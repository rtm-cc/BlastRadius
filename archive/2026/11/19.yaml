  - id: bcf0f8ae7658
    rank: 2
    title: MITRE Admits 87% of Recent CVE Records Carry Bogus Midnight-UTC Timestamps
    summary: 'MITRE has acknowledged that a legacy publishing system produced inaccurate timestamps in
      thousands of CVE records, after researcher Jerry Gamblin showed that 87% of CVEs published over
      the past year were stamped with exactly midnight UTC. MITRE says the legacy system will be phased
      out in the first quarter of 2027. The defect matters to anyone whose vulnerability-management or
      CI pipeline ingests CVE metadata: publication timestamps are widely used to compute patch SLAs,
      ''new CVE'' feeds and urgency scoring, so teams consuming the records should not treat CVE publication
      time as authoritative and should cross-check against vendor advisories or KEV dates when timing
      decisions depend on it.'
    url: https://socket.dev/blog/mitre-cve-timestamp-issues
    image: https://cdn.sanity.io/images/cgdhsj6q/production/66934eebddbae5b3b512d567a18fde74f1128a89-1672x941.png?w=1000&q=95&fit=max&auto=format
    sources:
    - Socket Threat Intel
    labels:
    - vulnerability
    - advisory
    - open source
    rationale: Data-integrity problem in the CVE feed that downstream scanners and CI pipelines depend
      on; included because the supply-chain candidate pool was otherwise dominated by already-published
      or non-supply-chain items.
