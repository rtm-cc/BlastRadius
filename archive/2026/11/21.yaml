    title: Critical OpenSSL Base64 Heap Buffer Overflow Can Corrupt Memory (CVE-2026-121481)
    summary: OpenSSL disclosed CVE-2026-121481, a CVSS 9.8 heap buffer overflow in the Base64 encoding
      function EVP_EncodeBlock() that can corrupt application memory when processing very large inputs.
      The critical score reflects potential severity and does not mean every service using OpenSSL is
      remotely exposed; no active exploitation has been reported. Applications and libraries that feed
      large amounts of data through base64 encoding should be patched.
