    title: AI red-teaming may be overfitting to the same prompt injections, study finds
    summary: Researchers at the University of Waterloo, Zhejiang University and KTH found that AI agents
      retrained on larger sets of prompt injection attacks became easier to hijack in three of four tests.
      The automated red-teaming tool that discovered more working attacks produced a weaker defense, suggesting
      current methods may repeatedly rediscover the same injections without actually improving robustness.
    url: https://www.helpnetsecurity.com/2026/11/20/ai-prompt-injection-red-team
