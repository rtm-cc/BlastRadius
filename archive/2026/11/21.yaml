    summary: 'WhatsApp''s November security update fixes three Android flaws: CVE-2026-102769 could let
      attackers delete files stored by WhatsApp on Android, another can expose a user''s IP address, and
      CVE-2026-23871 is an incomplete validation of external ad-reply URLs in WhatsApp and WhatsApp Business
      for Android before 2.26.17.4. WhatsApp found the latter while disrupting a scam campaign and says
      it may have been exploited to make scam messages more credible. Users should update to the latest
      version.'
