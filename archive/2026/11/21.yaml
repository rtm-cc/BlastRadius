  - id: 2085b0f003a5
    rank: 1
    title: Mail Bombing Attacks Fuel IT Helpdesk Impersonation Scams
    summary: Researchers documented a large-scale campaign in which attackers first flood a victim's inbox
      with emails, then call the victim while impersonating IT helpdesk staff. The fake technician uses
      the email chaos as a pretext to convince the user their account is being spammed or compromised,
      and pressures them into handing over passwords, MFA codes, or access that lets the attackers take
      over the account. The combination of inbox flooding and a trusted-sounding helpdesk call is designed
      to exploit alert fatigue and urgency.
    url: https://www.infosecurity-magazine.com/news/mail-bombing-attacks-it-helpdesk
    image: https://assets.infosecurity-magazine.com/webpage/og/2d1e6ffd-a4c3-409c-a9c6-0c7845da47ef.jpg
