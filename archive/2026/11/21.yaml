    title: Linux KVM Flaw Lets Guest VMs Read Host Memory on AMD Nested-Virtualization Hosts (CVE-2026-99312)
    summary: A flaw in KVM, the Linux kernel hypervisor, tracked as CVE-2026-99312, let researchers read
      roughly 127 GB of a cloud server's host memory from inside their own VM on DigitalOcean; on shared
      servers that memory can include other customers' VMs. It affects only AMD processors with nested
      virtualization enabled. Fixed kernels have shipped; cloud providers and admins should update.
