  - id: ce1a64f5f362
    rank: 3
    title: Russia's COLD RELIC Poses as Breached Firms' Employees to Phish New Targets
    summary: 'New reporting on the Russia-linked espionage group COLD RELIC (also tracked as Star Blizzard,
      Callisto, and Gossamer Bear; the US DOJ assesses it operates within Russia''s FSB) details its impersonation-phishing
      playbook. After compromising an organization, the group adopts the identities and email personas
      of that organization''s own employees to send phishing messages to fresh targets — government officials,
      defense contractors, and NGOs in Europe and North America. The lure reads as a routine, credible
      message from a familiar sender at an organization the victim already trusts, often referencing real
      internal context to add authenticity, and steers recipients toward credential-capture pages or requests
      for files. Because the sender address and tone look legitimate, recipients have little reason to
      pause. The guidance: treat unexpected requests from known senders with suspicion, verify via out-of-band
      channels, and require phishing-resistant authentication.'
    url: https://www.helpnetsecurity.com/2026/11/19/russian-spies-impersonation-cloud-breach
    image: https://img.helpnetsecurity.com/wp-content/uploads/2024/05/31195930/social-engineering_1500.webp
    sources:
    - Help Net Security
    - Graham Cluley
    labels:
    - social engineering
    - phishing
    - targeted attacks
    - espionage
    - account takeover
    rationale: 'COLD RELIC coverage continues the story first published under Breaches, but this new reporting
      adds a materially new angle: the group impersonates employees of already-breached organizations
      to phish new victims, describing the lure technique itself — the fraud/social-engineering angle
      relevant to this topic. The rest of the candidate pool for this topic is either a repeat of already-published
      scams (Elon Musk deepfake, AI-brand typosquatting, Scattered Spider sentencing, Microsoft 365 outage
      phishers) or out of scope (vulnerability patches, breaches, surveys, roundups), so no other eligible
      campaign exists.'
    is_update: true
    supersedes: bdf0af1ed656
    what_changed: New reporting specifies that COLD RELIC poses as employees of organizations it has already
      breached to phish new targets and describes the impersonation lure — detail absent from the earlier
      breach-focused coverage.
    cluster: bdf0af1ed656
    cluster_key: breached-cold-employees-firms-new-phish-poses-relic-russia-targets
    coverage:
    - title: Russian spies turn one cloud breach into a stepping stone for the next
      url: https://www.helpnetsecurity.com/2026/11/19/russian-spies-impersonation-cloud-breach
      source: Help Net Security
      published: '2026-11-19T14:42:20+00:00'
