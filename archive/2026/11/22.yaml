    summary: GnuPG warned of a critical memory corruption bug in GPGME, the standard library used to integrate
      GnuPG into applications. A malicious OpenPGP key with an unusually long user ID can trigger the
      flaw, potentially allowing data theft from affected applications. Fixed in GPGME version 2.3.0;
      all software using earlier versions should update.
