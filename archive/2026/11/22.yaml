    summary: F5 released emergency fixes for six critical BIG-IP vulnerabilities disclosed in its November
      18 out-of-band security notification. Remote attackers who can reach a vulnerable service can crash
      the BIG-IP process that handles client traffic (denial of service) without logging in, and F5 warns
      attackers may be able to run code on affected devices. The flaws affect specific traffic-handling
      configurations; administrators should apply the updates immediately.
