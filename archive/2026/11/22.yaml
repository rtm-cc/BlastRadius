    title: Ghostscript 'Upload2Shell' RCE Lets Attackers Run Commands via Crafted File Uploads
    summary: A now-patched critical flaw (CVE-2026-125396) in Ghostscript's Type 1 font loader, dubbed
      Upload2Shell, allows a crafted file to escape the program's security sandbox and run commands on
      the server processing it. Affecting upstream Ghostscript releases before 10.08.0, the flaw can be
      triggered indirectly by applications like WordPress, Roundcube, and Linux print servers that use
      file preview, thumbnail, or print features. No active exploitation has been reported, but a patch
      is available and administrators should update.
