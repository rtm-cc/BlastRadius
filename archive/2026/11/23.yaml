    rank: 1
    title: Fake Black Friday Deals Appear Early, Missing the Usual Scam Red Flags
    summary: This year's fake Black Friday deals began appearing on September 1, more than a month earlier
      than last year, and most lack the usual warning signs — they don't mention the holiday or use a
      lookalike address, according to Doppel. The lures surface as posts in Facebook groups or pages on
      Google Sites that carry a retailer's sale language on behalf of a software, payment, travel, or
      crypto service. Because the pitches avoid typical indicators like typosquatted domains, shoppers
      may not recognize them as scams before handing over payment or account details.
    url: https://www.helpnetsecurity.com/2026/11/23/black-friday-scams-doppel-report
