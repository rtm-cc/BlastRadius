      100 packages still contain copies of distrusted certificate authority (CA) certificates, including
      the emSign ECC Root CA that Debian removed from its system trust store on October 20. The finding
      shows that updating the OS trust store does not change which certificates an application accepts,
      so affected packages may keep trusting revoked CAs. Users should audit packages that embed their
      own CA lists.
