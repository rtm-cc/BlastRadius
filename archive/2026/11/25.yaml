    - Infosecurity Magazine
    - The Hacker News
    - Help Net Security
    labels:
    - phishing
    - social engineering
    - account takeover
    rationale: A concrete, large-scale vishing campaign aimed at employees' SSO credentials, with clear
      Social engineering lures that many people could encounter.
    is_update: false
