  - id: 49ae8815f1fe
    rank: 1
    title: Inception Extortion Gang Runs Large-Scale SSO Vishing Campaign
    summary: A newly surfaced extortion crew tracked as 'Inception' (and tied to the ShinyHunters collective)
      is running a large-scale vishing campaign that targets single sign-on (SSO) credentials at global
      brands across tech, healthcare, biotech, financial services, gaming, retail and more. The lures
      are phone calls that impersonate trusted parties and steer employees to credential-harvesting pages,
      then pressure them to approve device-code or MFA prompts so attackers can take over accounts. Okta
      and ReversingLabs link the operation to the ShinyHunters-associated cluster O-UNC-053.
    url: https://www.bleepingcomputer.com/news/security/new-inception-extortion-gang-launches-large-scale-vishing-campaign
    image: https://www.bleepstatic.com/content/hl-images/2026/11/24/inception.jpg
    sources:
