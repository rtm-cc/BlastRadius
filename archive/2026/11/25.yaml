      allowing them to run commands, traverse folders, read files, and open network tunnels while disguising
      itself as a normal system process. The malware was dropped by the ARTEX AI-driven hacking framework,
      but unlike typical short-lived ARTEX 'smash-and-grab' intrusions, this operator sought persistent
      access.
