# The AI Security column's own sources, on top of sources/shared.yaml.
# Every field is explained in config/README.md.

sources:
  - id: embrace_the_red
    type: rss
    name: Embrace The Red
    url: https://embracethered.com/blog/index.xml
    notes: Johann Rehberger's AI red teaming and agent exploitation research; a few a month.

  - id: owasp_genai
    type: rss
    name: OWASP GenAI Security Project
    url: https://genai.owasp.org/feed/
    notes: LLM Top 10 and agent security guidance; rare and authoritative.

  - id: simon_willison
    type: rss
    name: Simon Willison
    url: https://simonwillison.net/atom/everything/
    notes: ~2/day of posts and links; the best running coverage of prompt injection. Mostly general AI, which the brief drops.

  - id: trail_of_bits
    type: rss
    name: Trail of Bits
    url: https://blog.trailofbits.com/feed/
    notes: AI security audits, prompt injection defenses, LLM tool security, and AI red teaming.

  - id: wiz_research
    type: rss
    name: Wiz Research
    url: https://www.wiz.io/blog/rss.xml
    max_age_hours: 48
    max_items: 10
    notes: Breaks critical AI cloud infrastructure bugs, model registry vulnerabilities, and agentic attack research. Large feed; limited by max_items.

  - id: gnews_ai_security
    type: google_news
    name: "Google News: AI Security"
    query: '"AI" (vulnerability OR exploit OR "prompt injection" OR backdoor OR jailbreak)'
    max_age_hours: 24
    max_items: 15
    notes: Targeted Google News search capturing breaking AI security scoops across all publishers.

  - id: web_ai_security
    type: web_search
    name: "Web search: AI security"
    query: AI security news in the last 24 hours, such as prompt injection, AI agent vulnerabilities, jailbreaks and attackers using AI
    engine: parallel
