# The Policy & Enforcement column's own sources, on top of
# sources/shared.yaml. Every field is explained in config/README.md.

sources:
  - id: edpb
    type: rss
    name: European Data Protection Board
    url: https://www.edpb.europa.eu/rss.xml_en
    notes: GDPR guidelines and decisions. The path really ends "rss.xml_en".

  - id: ec_digital_strategy
    type: rss
    name: EC Digital Strategy
    url: https://digital-strategy.ec.europa.eu/en/rss.xml
    notes: NIS2, Cyber Resilience Act and AI Act milestones, with some unrelated digital policy.

  - id: noyb
    type: rss
    name: noyb
    url: https://noyb.eu/en/rss
    notes: >-
      GDPR complaints and enforcement, often ahead of the official channels;
      a few a week, none of it carried elsewhere (e.g. Fnac Darty fined EUR 7
      million, 2026-11-02). The feed is large, about 2.4 MB.

  - id: web_policy
    type: web_search
    name: "Web search: policy and enforcement"
    query: Cybersecurity regulation, data protection fines, law enforcement takedowns, arrests and sanctions against hackers in the last 24 hours
    engine: parallel
