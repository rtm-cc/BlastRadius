# Sources every topic sees. Security outlets carry breaches, vulnerabilities,
# threats and fraud alike, so they are fetched once and offered to every
# column; each topic's brief picks its slice. A topic's own sources are in
# sources/<topic>.yaml. Every field is explained in config/README.md.
#
# Volumes are items in the last 24 hours, measured 2026-10-27/28. Check a
# feed before adding it:  python -m blastradius check-feed <url>

sources:
  # === News =================================================================

  - id: bleeping_computer
    type: rss
    name: BleepingComputer
    url: https://www.bleepingcomputer.com/feed/
    notes: ~10/day. Fast on breaches and ransomware. Holds only 15 items.

  - id: the_hacker_news
    type: rss
    name: The Hacker News
    url: https://feeds.feedburner.com/TheHackersNews
    notes: ~12/day. Good recall, often a rewrite of a BleepingComputer story.

  - id: the_record
    type: rss
    name: The Record
    url: https://therecord.media/feed
    notes: ~5/day, strong on nation-state, policy and enforcement. Holds only 5 items.

  - id: security_week
    type: rss
    name: SecurityWeek
    url: https://www.securityweek.com/feed/
    notes: ~10/day, enterprise focused.

  - id: dark_reading
    type: rss
    name: Dark Reading
    url: https://www.darkreading.com/rss.xml
    notes: ~5/day of news, plus webinar promotion the briefs drop.


  - id: wired_security
    type: rss
    name: WIRED Security
    url: https://www.wired.com/feed/category/security/latest/rss
    notes: ~1/day.

  - id: risky_business_news
    type: rss
    name: Risky Business News
    url: https://risky.biz/feeds/risky-business-news/
    notes: ~1/day of short bulletins with real editorial judgement.

  - id: krebs_on_security
    type: rss
    name: Krebs on Security
    url: https://krebsonsecurity.com/feed/
    notes: About one post a week, investigative.

  - id: cybersecurity_news
    type: rss
    name: Cybersecurity News
    url: https://cybersecuritynews.com/feed/
    notes: ~5/day. Highly active breaking security news, including weekend coverage.

  - id: infosecurity_magazine
    type: rss
    name: Infosecurity Magazine
    url: https://www.infosecurity-magazine.com/rss/news/
    notes: ~4/day. Comprehensive reporting on threats, fraud, breaches, and policy.

  - id: help_net_security
    type: rss
    name: Help Net Security
    url: https://www.helpnetsecurity.com/feed/
    notes: >-
      ~10/day; the feed holds only its newest 10. Broad, European angle. On
      2026-11-02, 6 of its 10 stories were not carried by any other source
      here - the most new coverage of any feed tested - though some are
      tool and product write-ups the briefs drop.

  - id: cyberscoop
    type: rss
    name: CyberScoop
    url: https://cyberscoop.com/feed/
    notes: >-
      ~1.5/day. 8 of its 10 stories in the week to 2026-11-02 were new to
      this board, including scoops like a China-backed group using an
      agentic AI pentesting tool. Also carries US politics the briefs drop.

  # === Advisories ===========================================================

  - id: cisa_advisories
    type: rss
    name: CISA
    url: https://www.cisa.gov/cybersecurity-advisories/all.xml
    notes: >-
      ~3/day, including "CISA adds N known exploited vulnerabilities", the
      active-exploitation signal, and ICS advisories the briefs mostly drop.

  - id: sans_isc
    type: rss
    name: SANS Internet Storm Center
    url: https://isc.sans.edu/rssfeed_full.xml
    notes: ~2/day. Often the earliest sign something is exploited in the wild.

  # === Research =============================================================

  - id: unit42
    type: rss
    name: Palo Alto Unit 42
    url: https://unit42.paloaltonetworks.com/feed/
    notes: A few a week. Deep campaign and threat actor analysis.

  - id: google_threat_intel
    type: rss
    name: Google Threat Intelligence (Mandiant)
    url: https://cloudblog.withgoogle.com/topics/threat-intelligence/rss/
    notes: A few a month. Use exactly this host; cloud.google.com serves bots an empty page.

  - id: ms_threat_intel
    type: rss
    name: Microsoft Threat Intelligence
    url: https://www.microsoft.com/en-us/security/blog/topic/threat-intelligence/feed/
    notes: ~1-2/day. Canonical state actor tracking, APT attribution, and malware forensics.

  - id: securelist
    type: rss
    name: Securelist
    url: https://securelist.com/feed/
    notes: ~1/day, Kaspersky's threat research.

  - id: cisco_talos
    type: rss
    name: Cisco Talos
    url: https://feeds.feedburner.com/feedburner/Talos
    notes: >-
      ~1/day. In the week to 2026-11-02, 5 of 6 posts were research no other
      source here carried (VOLTA infostealer, NIK C2, a Cisco SD-WAN
      campaign). Full post bodies, about 1 MB per fetch.

  - id: sophos_research
    type: rss
    name: Sophos X-Ops
    url: https://www.sophos.com/en-us/category/threat-research/feed
    notes: >-
      A few a week of malware and incident research, high signal: AI-assisted
      ransomware and an actively exploited Node.js flaw in the week to
      2026-11-02, 2 of 3 posts new to this board.

  - id: rapid7
    type: rss
    name: Rapid7
    url: https://www.rapid7.com/rss.xml
    notes: >-
      ~1/day. The emergent threat response and vulnerability analyses are
      strong (4 of 5 posts new to this board in the week to 2026-11-02);
      about half the feed is product content the briefs drop.

  - id: eset_welivesecurity
    type: rss
    name: ESET WeLiveSecurity
    url: https://www.welivesecurity.com/en/rss/feed/
    notes: A few a week. Good on APTs, scams and breaches.

  - id: malwarebytes
    type: rss
    name: Malwarebytes
    url: https://www.malwarebytes.com/blog/feed/index.xml
    notes: ~3/day, strong on scams and phishing lures.

  - id: tldr_sec
    type: rss
    name: tl;dr sec
    url: https://rss.beehiiv.com/feeds/xgTKUmMmUm.xml
    notes: A weekly appsec newsletter; each issue is a roundup of links.

  # Considered and left out. Measured over the week to 2026-11-02 against
  # this board's own sources, so nobody has to test them again:
  #   Already covered    Ars Technica, CISA ICS (inside cisa_advisories),
  #                      Check Point Research - next to nothing new.
  #   Noise              ZDI published advisories (~5/day of bare advisories;
  #                      the ZDI blog is in vulnerabilities.yaml), Cloudflare,
  #                      AWS Security, Proofpoint (product posts), OpenAI news
  #                      (corporate), Hunton (US state privacy law).
  #   Dead or empty      Semgrep (404), Group-IB (nothing in a week), NCSC UK,
  #                      Google Safety & Security (consumer tips).
  #   Not worth testing  three security podcasts (nothing to read), CVEMon
  #                      (bare CVE ids, no context), the MSRC update guide
  #                      (~50 raw CVE entries a day), CISA Alerts (a subset
  #                      of cisa_advisories), the Google Online Security Blog
  #                      (dormant), Rhino Security Labs (vendor blog).
