# The Supply Chain column's own sources, on top of sources/shared.yaml.
# Every field is explained in config/README.md.

sources:
  - id: reversinglabs
    type: rss
    name: ReversingLabs
    url: https://www.reversinglabs.com/blog/rss.xml
    notes: ~1/week. Deep dives on software tampering, malicious packages, and CI/CD supply chain attacks.

  - id: checkmarx
    type: rss
    name: Checkmarx Research
    url: https://checkmarx.com/feed/
    notes: ~1-2/week. Malicious open source packages (npm/PyPI) and dependency confusion research.

  - id: openssf
    type: rss
    name: OpenSSF
    url: https://openssf.org/feed/
    notes: Open source supply chain security initiatives, tooling, and advisories.

  - id: socket_dev
    type: rss
    name: Socket Threat Intel
    url: https://socket.dev/api/blog/feed.atom
    notes: ~1/day. Tracks malicious npm, PyPI, and VS Code extensions in real time.

  - id: chainguard
    type: rss
    name: Chainguard
    url: https://www.chainguard.dev/unchained/rss.xml
    notes: ~1-2/week. Software supply chain security, SBOMs, and container base images.

  - id: snyk_research
    type: rss
    name: Snyk Research
    url: https://snyk.io/blog/feed/
    notes: ~1/day. Open source vulnerabilities, package health, and dependency disclosures.

  - id: web_supply_chain
    type: web_search
    name: "Web search: supply chain"
    query: Software supply chain attacks, malicious npm or PyPI packages and compromised build pipelines reported in the last 24 hours
    engine: parallel
