# The Active Threats column's own sources, on top of sources/shared.yaml.
# Every field is explained in config/README.md.

sources:
  - id: citizen_lab
    type: rss
    name: Citizen Lab
    url: https://citizenlab.ca/feed/
    notes: Commercial spyware investigations (Pegasus, Predator) and state-sponsored digital espionage.

  - id: dfir_report
    type: rss
    name: The DFIR Report
    url: https://thedfirreport.com/feed/
    notes: In-depth end-to-end incident response intrusion cases from initial access to ransomware execution.

  - id: web_threats
    type: web_search
    name: "Web search: active threats"
    query: Ransomware attacks, malware campaigns and nation-state hacking operations reported in the last 24 hours
    engine: parallel
