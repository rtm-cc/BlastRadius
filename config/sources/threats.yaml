# The Active Threats column's own sources, on top of sources/shared.yaml.
# Every field is explained in config/README.md.

sources:
  - id: citizen_lab
    type: rss
    name: Citizen Lab
    url: https://citizenlab.ca/feed/
    notes: Commercial spyware investigations (Pegasus, Predator) and state-sponsored digital espionage.

  - id: dfir_report
    type: rss
    name: The DFIR Report
    url: https://thedfirreport.com/feed/
    notes: In-depth end-to-end incident response intrusion cases from initial access to ransomware execution.

  - id: huntress
    type: rss
    name: Huntress
    url: https://www.huntress.com/blog/rss.xml
    notes: >-
      ~1/day. Incident write-ups no other source here carried in the week to
      2026-11-02 (MDM abused for remote access, the ConnectWise attack),
      mixed with marketing the brief drops.

  - id: recorded_future
    type: rss
    name: Recorded Future (Insikt Group)
    url: https://www.recordedfuture.com/feed
    notes: Rare - one post in the week to 2026-11-02 - but distinctive criminal ecosystem analysis.

  - id: web_threats
    type: web_search
    name: "Web search: active threats"
    query: Ransomware attacks, malware campaigns and nation-state hacking operations reported in the last 24 hours
    engine: parallel
