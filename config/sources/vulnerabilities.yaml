# The Vulnerabilities & Patches column's own sources, on top of
# sources/shared.yaml. Every field is explained in config/README.md.

sources:
  - id: cisa_kev
    type: cisa_kev
    name: CISA KEV
    url: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
    notes: >-
      CISA's Known Exploited Vulnerabilities catalog, ~1-2 additions a day:
      the "exploited in the wild" signal, one candidate per CVE added, linked
      to its NVD page. The JSON feed CISA publishes for programs; the
      advisories RSS in shared.yaml often answers scripts with HTTP 403
      (seen 2026-11-05) and is kept for the days it works. About 1.7 MB.

  - id: project_zero
    type: rss
    name: Google Project Zero
    url: https://googleprojectzero.blogspot.com/feeds/posts/default
    notes: Rare, world-class root cause and exploit analysis of in-the-wild zero-days.

  - id: zdi
    type: rss
    name: Zero Day Initiative
    url: https://www.zerodayinitiative.com/blog?format=rss
    notes: Zero-day vulnerability disclosures, bug bounty findings, and Patch Tuesday breakdowns.

  - id: web_vulnerabilities
    type: web_search
    name: "Web search: vulnerabilities"
    query: Zero-day vulnerabilities, actively exploited flaws and emergency security patches disclosed in the last 24 hours
    engine: parallel
