<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Blast Radius: rings spreading from an impact, on alarm red. Shapes
       only, so it never depends on fonts and stays readable at 16px. -->
  <defs>
    <linearGradient id="alarm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a0a10"/>
      <stop offset="1" stop-color="#c8102e"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#alarm)"/>
  <circle cx="32" cy="32" r="22.5" fill="none" stroke="#fff" stroke-opacity=".42" stroke-width="4.2"/>
  <circle cx="32" cy="32" r="13.5" fill="none" stroke="#fff" stroke-opacity=".78" stroke-width="4.8"/>
  <circle cx="32" cy="32" r="6" fill="#fff"/>
</svg>
